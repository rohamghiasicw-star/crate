<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0B0B0F; --surface:#16161C; --surface2:#1F1F27;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.12);
  --text:#F5F5F7; --muted:#9A9AA2; --faint:#636369; --accent:#6B5FE0; --good:#30D158;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",sans-serif;
  -webkit-font-smoothing:antialiased;padding:14px 20px 0}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:8px 0 2px}
.lt{font-size:32px;font-weight:700;letter-spacing:-.6px}
.chip{font-size:13px;color:var(--muted);border:1px solid var(--hair);border-radius:999px;padding:5px 11px}
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;margin:34px 0 30px}
.scan{width:128px;height:128px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(107,95,224,.35);border:1px solid rgba(255,255,255,.14)}
.htxt{text-align:center}
.htxt b{font-size:19px;font-weight:600;letter-spacing:-.3px}
.htxt span{display:block;color:var(--muted);font-size:14px;margin-top:5px}
.paste{display:flex;align-items:center;gap:11px;background:var(--surface);
  border:1px solid var(--hair);border-radius:14px;padding:14px 16px;margin-bottom:26px}
.paste svg{color:var(--faint);flex:none}
.paste .ph{color:var(--faint);font-size:15px;flex:1}
.paste .act{color:var(--accent);font-size:15px;font-weight:600}
.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.2px;
  text-transform:uppercase;margin:0 2px 12px}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--hair);border-radius:18px;padding:14px;margin-bottom:26px}
.mosaic{width:56px;height:56px;border-radius:12px;overflow:hidden;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;flex:none}
.mosaic i{display:block}
.cinfo{flex:1;min-width:0}
.cinfo b{font-size:16px;font-weight:600;letter-spacing:-.2px}
.cinfo span{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.play{width:40px;height:40px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;align-items:center;gap:13px;padding:9px 2px}
.art{width:48px;height:48px;border-radius:11px;flex:none}
.rinfo{flex:1;min-width:0}
.rinfo b{font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.rinfo span{display:block;color:var(--muted);font-size:13px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vpill{font-size:11px;font-weight:600;color:var(--good);
  border:1px solid rgba(48,209,88,.4);border-radius:999px;padding:3px 9px;flex:none}
.vpill.edit{color:var(--accent);border-color:rgba(107,95,224,.45)}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:10px 0 26px;background:rgba(11,11,15,.86);backdrop-filter:blur(20px);
  border-top:1px solid var(--hair)}
.tb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--faint)}
.tb.on{color:var(--accent)}
</style></head><body>

<div class="top"><div class="lt">Addify</div><div class="chip">5 scans</div></div>

<div class="hero">
  <div class="scan">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none"><path d="M8 26c4-14 8-14 12 0s8 14 12 0 8-14 12 0" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="htxt"><b>Share a reel to Addify</b><span>or tap to listen to whatever is playing</span></div>
</div>

<div class="paste">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 15l6-6M8 12l-2 2a3.5 3.5 0 005 5l2-2M16 12l2-2a3.5 3.5 0 00-5-5l-2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <span class="ph">Paste a TikTok or Instagram link</span>
  <span class="act">Paste</span>
</div>

<div class="sec">Your playlist</div>
<div class="card">
  <div class="mosaic">
    <i style="background:#5B6EE1"></i><i style="background:#C2557A"></i>
    <i style="background:#3FA796"></i><i style="background:#D6923B"></i>
  </div>
  <div class="cinfo"><b>Found with Addify</b><span>6 songs, synced to Spotify</span></div>
  <div class="play"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
</div>

<div class="sec">Recent finds</div>
<div class="row">
  <div class="art" style="background:linear-gradient(150deg,#7B5AD1,#4C3C93)"></div>
  <div class="rinfo"><b>Nightfall</b><span>Aria Vega, from @gymclipsdaily</span></div>
  <span class="vpill edit">Slowed</span>
</div>
<div class="row">
  <div class="art" style="background:linear-gradient(150deg,#2E9E8F,#1C5E56)"></div>
  <div class="rinfo"><b>Compa Coleto</b><span>Aria Vega, original</span></div>
  <span class="vpill">Original</span>
</div>

<div class="tab">
  <div class="tb on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Home</div>
  <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Search</div>
  <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 4h12v16l-6-4-6 4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Finds</div>
  <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M5 20c1-4 4-5 7-5s6 1 7 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>You</div>
</div>

</body></html>
