  <rect x="20" y="392" width="38" height="38" rx="11" fill="#1F1F27"/>
  <circle cx="39" cy="407" r="4.5" fill="none" stroke="#6B5FE0" stroke-width="1.8"/>
  <path d="M31 421c1.5-4 4.5-5.5 8-5.5s6.5 1.5 8 5.5" fill="none" stroke="#6B5FE0" stroke-width="1.8" stroke-linecap="round"/>
  <text x="70" y="410" font-size="16" font-weight="600" fill="#F5F5F7">Who posts the edits</text>
