  <circle cx="44" cy="140" r="7" fill="none" stroke="#636369" stroke-width="1.7"/><path d="M49 145l5 5" stroke="#636369" stroke-width="1.7" stroke-linecap="round"/>
  <text x="66" y="145" font-size="14.5" fill="#636369">a lyric, a vibe, or that gym reel song</text>
  <rect x="336" y="132" width="12" height="16" rx="6" fill="none" stroke="#636369" stroke-width="1.6" opacity="0.5"/>

  <text x="22" y="196" font-size="13" fill="#636369">Hum to search is coming soon</text>

  <text x="22" y="232" font-size="12" font-weight="600" fill="#9A9AA2" letter-spacing="1">THREE WAYS TO SEARCH</text>

