# Mock App Review harness. NOT part of the shipped app.
#
# A UI test bundle cannot drive another app unless it rides on a host app of its own, so this
# project holds a one-screen MockHost and the ReviewerUITests bundle. The tests never touch
# MockHost: they drive the real Addify build by bundle id (XCUIApplication(bundleIdentifier:)),
# installed fresh on the simulator by .github/workflows/mock-review.yml. Keeping this outside
# ios/ means ios/Addify.xcodeproj stays exactly what ships, and pushing here does not trigger
# the ios-build or ios-ipa workflows.
#
# Generated on the runner with XcodeGen: xcodegen generate --spec mockreview/project.yml
name: MockReview
options:
  bundleIdPrefix: com.addify.mockreview
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Simulator only: "Sign to Run Locally" needs no Apple account or profile.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MockHost:
    type: application
    platform: iOS
    sources: [MockHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addify.mockreview.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ReviewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReviewerUITests]
    dependencies:
      - target: MockHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addify.mockreview.uitests
        TEST_TARGET_NAME: MockHost
schemes:
  ReviewerUITests:
    build:
      targets:
        MockHost: all
        ReviewerUITests: [test]
    test:
      config: Debug
      targets: [ReviewerUITests]
