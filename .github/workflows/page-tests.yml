name: page-tests
# Headless browser suites for the page the app loads (engine/crate.html), on a clean Linux runner.
# No network to the live server: every suite serves the page from the promise-ledger mock engine.
on:
  workflow_dispatch:
  push:
    branches: [release-candidate, 'kfix-*']
    paths: ['engine/crate.html', 'engine/test_*.py', '.github/workflows/page-tests.yml']
jobs:
  page:
    runs-on: ubuntu-24.04   # Playwright 1.60 has no WebKit build for ubuntu 26.04 (failed run 43290437832)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install playwright==1.60.0 && python -m playwright install --with-deps webkit chromium
      - name: Promise ledger
        run: python engine/test_promise_ledger.py
      - name: Saved-scan layout
        run: python engine/test_thunder_layout.py
      - name: Paywall sheet (WebKit)
        run: PW_BROWSER=webkit python engine/test_paywall_sheet.py --shots out/paywall
      - name: Onboarding v4 (WebKit)
        run: ONB_SHOTS=out/onboarding python engine/test_onboarding_v4.py engine/crate.html
      - name: Reviewer-run fixes (WebKit)
        run: python engine/test_reviewer_fixes.py
      - name: Reviewer-run fixes (Chromium)
        run: PW_BROWSER=chromium python engine/test_reviewer_fixes.py
      - name: Reviewer-run fixes 2 (WebKit)
        run: python -u engine/test_reviewer_fixes2.py
      - name: Reviewer-run fixes 2 (Chromium)
        run: PW_BROWSER=chromium python -u engine/test_reviewer_fixes2.py
      - name: Polish 3 (WebKit)
        run: python -u engine/test_polish3.py
      - name: Polish 3 (Chromium)
        run: PW_BROWSER=chromium python -u engine/test_polish3.py
      - name: Preview gate, App Review 2.5.19 (WebKit)
        run: python -u engine/test_preview_gate.py
      - name: Preview gate, App Review 2.5.19 (Chromium)
        run: PW_BROWSER=chromium python -u engine/test_preview_gate.py
      - name: Round 3 (WebKit)
        run: python -u engine/test_round3.py
      - name: Round 3 (Chromium)
        run: PW_BROWSER=chromium python -u engine/test_round3.py
      - name: Round 4 (WebKit)
        run: python -u engine/test_round4.py
      - name: Round 4 (Chromium)
        run: PW_BROWSER=chromium python -u engine/test_round4.py
      - name: Round 5a (WebKit)
        run: python -u engine/test_round5a.py
      - name: Round 5a (Chromium)
        run: PW_BROWSER=chromium python -u engine/test_round5a.py
      - name: Round 5b (WebKit)
        run: python -u engine/test_round5b.py
      - name: Round 5b (Chromium)
        run: PW_BROWSER=chromium python -u engine/test_round5b.py
      - name: Busy retry (Chromium)
        run: python -u engine/test_busy_retry.py --page engine/crate.html
      - name: Call retry (Chromium)
        run: python -u engine/test_call_retry.py --page engine/crate.html
      - name: Soft replay (Chromium)
        run: python -u engine/test_soft_replay.py --page engine/crate.html
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: page-shots, path: out/, if-no-files-found: ignore }
