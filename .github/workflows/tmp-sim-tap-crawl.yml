          python3 - <<'PY'
          import hashlib
          src = open("engine/crate.html", "rb").read()
          a = b"<script>if(window.ADDIFY_NATIVE||"
          i = src.find(a)
          page = src[:i] + b'<script>window.ADDIFY_BUILD="1793457158";</script>' + src[i:]
          h = hashlib.md5(page).hexdigest()
          print("page md5", h)
          assert h == "a85e8ae21bce8dfa1d9e49be2f9b9b5b"
