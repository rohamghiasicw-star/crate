          ls agentdd/Build/Products
      - name: Route the engine name to the local stand-in, black-hole the real address
        run: |
          APP=app/Addify.app
          W2=$(printf '%s%s' ss lip)
          ALT=$(strings -a "$APP/Addify" | grep -Eo "https://[a-z0-9.-]+\.${W2}\.io" | head -1 | sed 's#https://##')
          [ -n "$ALT" ] && echo "::add-mask::$ALT"
          REAL=$(dig +short @1.1.1.1 addify.app A | grep -E '^[0-9]+(\.[0-9]+){3}$' | tail -1)
          [ -n "$REAL" ] && echo "::add-mask::$REAL"
          DASH=$(echo "$REAL" | tr '.' '-'); [ -n "$DASH" ] && echo "::add-mask::$DASH"
          printf '%s\n%s\n%s\n%s\n' "$ALT" "$REAL" "$DASH" "$W2" > /tmp/fx/secrets.txt
          ALTIP=$(dig +short @1.1.1.1 "$ALT" A | tail -1)
          [ "$ALTIP" = "$REAL" ] && echo "second name resolves to the same address" || echo "second name resolves elsewhere"
          printf 'block drop quick inet from any to %s\npass all\n' "$REAL" > /tmp/pf.rules
          sudo pfctl -E > /dev/null 2>&1 || true; sudo pfctl -f /tmp/pf.rules > /dev/null 2>&1
          printf '127.0.0.1 addify.app\n::1 addify.app\n127.0.0.1 www.tiktok.com\n::1 www.tiktok.com\n' | sudo tee -a /etc/hosts > /dev/null
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          cd /tmp/fx
          cat > ca.cnf <<'CNF'
          [req]
          distinguished_name=dn
          x509_extensions=v3
          prompt=no
          [dn]
          CN=Throwaway Sim CA
          [v3]
          basicConstraints=critical,CA:TRUE
          keyUsage=critical,keyCertSign,cRLSign
          subjectKeyIdentifier=hash
          CNF
          cat > srv.ext <<'CNF'
          basicConstraints=CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:addify.app,DNS:www.tiktok.com
          CNF
          openssl req -x509 -new -nodes -newkey rsa:2048 -sha256 -days 30 -keyout ca.key -out ca.pem -config ca.cnf 2>/dev/null
          openssl req -new -nodes -newkey rsa:2048 -sha256 -keyout srv.key -out srv.csr -subj "/CN=addify.app" 2>/dev/null
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out srv.pem -days 20 -sha256 -extfile srv.ext 2>/dev/null
          mkdir -p "$GITHUB_WORKSPACE/out/stub/ctl"; chmod 777 "$GITHUB_WORKSPACE/out/stub/ctl"
          sudo nohup python3 "$GITHUB_WORKSPACE/kit/stub.py" /tmp/fx "$GITHUB_WORKSPACE/out/stub" --tls /tmp/fx/srv.pem /tmp/fx/srv.key --port 443 --host :: --pages "$GITHUB_WORKSPACE/engine/pages" > /tmp/stub.out 2>&1 &
          sleep 3; cat /tmp/stub.out
          echo "== checks" | tee "$GITHUB_WORKSPACE/out/net-checks.txt"
          curl -s --cacert ca.pem -D - -o /dev/null https://addify.app/health | grep -iE '^HTTP|x-stub' | tee -a "$GITHUB_WORKSPACE/out/net-checks.txt"
          curl -s --cacert ca.pem -o /dev/null -w "terms %{http_code}\n" https://addify.app/terms | tee -a "$GITHUB_WORKSPACE/out/net-checks.txt"
          curl -s --cacert ca.pem -o /dev/null -w "video page stand-in %{http_code}\n" https://www.tiktok.com/@bouch.szn/video/1 | tee -a "$GITHUB_WORKSPACE/out/net-checks.txt"
          t=$(date +%s); rc=0; curl -s -m 12 -o /dev/null "https://$ALT/health" || rc=$?
          echo "second name: curl exit $rc after $(( $(date +%s) - t )) s (28 = timed out, silent drop)" | tee -a "$GITHUB_WORKSPACE/out/net-checks.txt"
          [ "$rc" = "28" ] || { echo "second name is not black-holed"; exit 1; }
          rc=0; curl -s -m 6 -o /dev/null --resolve "addify.app:443:$REAL" https://addify.app/health || rc=$?
          echo "real address: curl exit $rc" | tee -a "$GITHUB_WORKSPACE/out/net-checks.txt"
          [ "$rc" = "28" ] || { echo "real address not dropped"; exit 1; }
          system_profiler SPAudioDataType > "$GITHUB_WORKSPACE/out/runner-audio.txt" 2>&1 || true
          grep -E "Input|Output|Default" "$GITHUB_WORKSPACE/out/runner-audio.txt" | head -12 || true
      - name: Cases
        timeout-minutes: 150
        env:
          CASE_TIMEOUT: '1200'
        run: bash kit/run.sh "${{ matrix.device }}" "${{ matrix.runtime }}" "${{ matrix.role }}" testA1_shareFirstNeverOpened testA2_killedOnOnboarding2 testA3_backgroundOnOnboarding2 testB_useUpFiveThenReinstall testC_listenMicDenied testD_deleteDuringShareAndScan testG_shareOverPaywallAndToast testE_restore
      - name: Scrub and shrink
        if: always()
        run: |
          set +e
          sudo chown -R "$(whoami)" out
          cp /tmp/stub.out out/stub/ 2>/dev/null
          cp app-info.txt out/ 2>/dev/null
          sudo pfctl -vsr 2>/dev/null | grep -A2 block | sed -e "s/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/<addr>/g" > out/pf-final.txt
          for f in $(find out -name '*.png'); do sips -s format jpeg -s formatOptions 62 -Z 1400 "$f" --out "${f%.png}.jpg" > /dev/null 2>&1 && rm "$f"; done
          while read -r s; do
            [ -z "$s" ] && continue
            for f in $(grep -rIl -F "$s" out 2>/dev/null); do LC_ALL=C sed -i '' "s#${s}#<scrubbed>#g" "$f"; done
          done < /tmp/fx/secrets.txt
          left=0
          while read -r s; do
            [ -z "$s" ] && continue
            for f in $(grep -ral -F "$s" out 2>/dev/null); do echo "leak removed: $f"; rm -f "$f"; left=$((left+1)); done
          done < /tmp/fx/secrets.txt
          echo "files removed for leaks: $left"
          echo "any file still naming the second host word: $(grep -rail "$(printf '%s%s' ss lip)" out | wc -l)"
          du -sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ov-${{ matrix.shard }}
          path: out
          retention-days: 3
