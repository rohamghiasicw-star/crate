          xcodebuild -version | tee out/xcode.txt; sw_vers | tee -a out/xcode.txt
          python3 -m pip install --user --break-system-packages -q pillow 2>&1 | tail -2 || python3 -m pip install --user -q pillow 2>&1 | tail -2 || true
      - name: Inventory (every installed Xcode 27.x, device types, runtimes)
        if: matrix.inventory == 'yes'
        run: |
          set +e
          for x in /Applications/Xcode_27*.app; do
            r=$(realpath "$x"); echo "$x -> $r" >> out/inventory/xcodes.txt
          done
          for r in $(for x in /Applications/Xcode_27*.app; do realpath "$x"; done | sort -u); do
            n=$(basename "$r" .app)
            DEVELOPER_DIR="$r/Contents/Developer" xcodebuild -version > "out/inventory/$n-version.txt" 2>&1
            DEVELOPER_DIR="$r/Contents/Developer" xcrun simctl list devicetypes runtimes > "out/inventory/$n-simctl-devicetypes-runtimes.txt" 2>&1
            DEVELOPER_DIR="$r/Contents/Developer" xcrun simctl list -j devicetypes runtimes > "out/inventory/$n-simctl.json" 2>&1
          done
          xcrun simctl help > out/inventory/simctl-help.txt 2>&1
          xcrun simctl io help > out/inventory/simctl-io-help.txt 2>&1
          python3 - > out/inventory/devicetype-screens.txt <<'EOF'
          import glob, plistlib, os
          seen = set()
          roots = glob.glob("/Applications/Xcode_27*.app/Contents/Developer/Platforms/*/Library/Developer/CoreSimulator/Profiles/DeviceTypes/*.simdevicetype") + \
                  glob.glob("/Library/Developer/CoreSimulator/Profiles/DeviceTypes/*.simdevicetype")
          for d in sorted(roots, key=os.path.basename):
              n = os.path.basename(d)
              if n in seen: continue
              seen.add(n)
              p = os.path.join(d, "Contents/Resources/profile.plist")
              try:
                  pl = plistlib.load(open(p, "rb"))
              except Exception as e:
                  print(n, "ERR", e); continue
              w, h, s = pl.get("mainScreenWidth"), pl.get("mainScreenHeight"), pl.get("mainScreenScale")
              pts = (round(w / s), round(h / s)) if w and h and s else None
              extra = sorted(k for k in pl if any(t in k.lower() for t in ("screen", "display", "fold", "posture", "hinge")))
              print("%-45s px=%sx%s scale=%s pt=%s chrome=%s minRuntime=%s keys=%s" % (n, w, h, s, pts, pl.get("chromeIdentifier"), pl.get("minRuntimeVersionString"), extra))
          EOF
          for d in /Applications/Xcode_27*.app/Contents/Developer/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/Profiles/DeviceTypes/iPhone\ Duo*.simdevicetype /Library/Developer/CoreSimulator/Profiles/DeviceTypes/iPhone\ Duo*.simdevicetype; do
            [ -d "$d" ] || continue
            echo "== $d" >> out/inventory/duo-profile.txt
            find "$d" -maxdepth 3 -type f | head -40 >> out/inventory/duo-profile.txt
            for f in "$d/Contents/Resources/profile.plist" "$d/Contents/Resources/capabilities.plist" "$d/Contents/Info.plist"; do
              [ -f "$f" ] && { echo "-- $f"; plutil -p "$f"; } >> out/inventory/duo-profile.txt 2>&1
            done
          done
          { echo "== posture/fold strings"; for b in "$(xcrun -f simctl)" /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/CoreSimulator \
              "$(xcode-select -p)/Library/PrivateFrameworks/SimulatorKit.framework/Versions/A/SimulatorKit"; do
              [ -f "$b" ] && { echo "-- $b"; strings -a "$b" | grep -i -E 'posture|foldable|hinge|unfold|duo' | sort -u | head -60; }; done; } > out/inventory/posture-strings.txt 2>&1
          grep -i -E 'posture|fold|hinge|display' out/inventory/simctl-help.txt out/inventory/simctl-io-help.txt | head -20
          cat out/inventory/devicetype-screens.txt | grep -E '^iPhone|^iPad|^Apple Vision' | head -80
          true
      - name: Older runtime (time-boxed)
        if: matrix.fetch16 == 'yes'
        run: |
          set +e
          xcrun simctl list runtimes | tee out/inventory/runtimes-before.txt
          for v in 16.4 16.0; do
            ( xcodebuild -downloadPlatform iOS -buildVersion $v > out/inventory/download-ios-$v.log 2>&1; echo "rc=$?" >> out/inventory/download-ios-$v.log ) &
            P=$!; n=0; while kill -0 $P 2>/dev/null && [ $n -lt 600 ]; do sleep 5; n=$((n+5)); done
            kill -0 $P 2>/dev/null && { kill $P; echo "killed after 600 s" >> out/inventory/download-ios-$v.log; }
            tail -5 out/inventory/download-ios-$v.log
            xcrun simctl list runtimes | grep -q "iOS 16" && break
          done
          xcrun simctl list runtimes | tee out/inventory/runtimes-after.txt
          true
      - name: Newer runtime download
        if: matrix.fetch == 'yes'
        run: |
          set +e
          t=$(date +%s); xcodebuild -downloadPlatform iOS > out/inventory/download-ios.log 2>&1; echo "rc=$? after $(( $(date +%s)-t )) s" | tee -a out/inventory/download-ios.log
          tail -5 out/inventory/download-ios.log
          xcrun simctl list runtimes | tee out/inventory/runtimes-after.txt
          true
      - name: Build the UI agent
        if: matrix.profile != 'vision'
        run: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          which xcodegen || brew install xcodegen > /tmp/brew.log 2>&1 || { tail -20 /tmp/brew.log; exit 1; }
          mkdir -p /tmp/agent/Host /tmp/agent/UITests
          cp /tmp/kit/agent-project.yml /tmp/agent/project.yml; cp /tmp/kit/Agent.swift /tmp/agent/UITests/
          printf 'import SwiftUI\n@main\nstruct AgentHostApp: App {\n    var body: some Scene { WindowGroup { Text("agent host") } }\n}\n' > /tmp/agent/Host/AgentHostApp.swift
          cd /tmp/agent && xcodegen generate > /dev/null
          xcodebuild build-for-testing -project /tmp/agent/Agent.xcodeproj -scheme AgentUITests -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/agentdd CODE_SIGNING_ALLOWED=NO > /tmp/agentbuild.log 2>&1 \
            || { grep -E 'error:' /tmp/agentbuild.log | head -30; tail -30 /tmp/agentbuild.log; exit 1; }
          ls /tmp/agentdd/Build/Products/*.xctestrun
      - name: Route both server names away; start the stub
        run: |
          set -e
          APP=$(ls -d /tmp/app/*.app)
          ALT=$(strings -a "$APP/Addify" | grep -Eo 'https://[a-z0-9.-]+\.sslip\.io' | head -1 | sed 's#https://##')
          [ -n "$ALT" ] && echo "::add-mask::$ALT"
          REAL=$(dig +short @1.1.1.1 addify.app A | grep -E '^[0-9]+(\.[0-9]+){3}$' | tail -1)
          REAL6=$(dig +short @1.1.1.1 addify.app AAAA | grep ':' | tail -1)
          [ -n "$REAL" ] && echo "::add-mask::$REAL"; [ -n "$REAL6" ] && echo "::add-mask::$REAL6"
          echo "$ALT" > /tmp/alt.txt; echo "$REAL" > /tmp/real.txt; echo "$REAL6" > /tmp/real6.txt
          { printf 'block drop quick inet from any to %s\n' "$REAL"; [ -n "$REAL6" ] && printf 'block drop quick inet6 from any to %s\n' "$REAL6"; printf 'pass all\n'; } > /tmp/pf.rules
          sudo pfctl -E > /dev/null 2>&1 || true; sudo pfctl -f /tmp/pf.rules > /dev/null 2>&1
          printf '127.0.0.1 addify.app\n::1 addify.app\n127.0.0.1 www.tiktok.com\n::1 www.tiktok.com\n0.0.0.0 %s\n:: %s\n' "$ALT" "$ALT" | sudo tee -a /etc/hosts > /dev/null
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          cd /tmp/kit
          printf '[req]\ndistinguished_name=dn\nx509_extensions=v3\nprompt=no\n[dn]\nCN=Throwaway Sim CA\n[v3]\nbasicConstraints=critical,CA:TRUE\nkeyUsage=critical,keyCertSign,cRLSign\nsubjectKeyIdentifier=hash\n' > ca.cnf
          printf 'basicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:addify.app,DNS:www.tiktok.com\n' > srv.ext
          openssl req -x509 -new -nodes -newkey rsa:2048 -sha256 -days 30 -keyout ca.key -out ca.pem -config ca.cnf 2>/dev/null
          openssl req -new -nodes -newkey rsa:2048 -sha256 -keyout srv.key -out srv.csr -subj "/CN=addify.app" 2>/dev/null
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out srv.pem -days 20 -sha256 -extfile srv.ext 2>/dev/null
          sudo mkdir -p /tmp/stubout && sudo chmod 777 /tmp/stubout
          sudo nohup /usr/bin/python3 /tmp/kit/stub.py /tmp/stubout /tmp/kit/srv.pem /tmp/kit/srv.key "$GITHUB_WORKSPACE/src" /tmp/kit > /tmp/stub.out 2>&1 &
          sleep 3; cat /tmp/stub.out
          curl -s --cacert ca.pem https://addify.app/health | head -c 120; echo
          echo "page probe tags: $(curl -s --cacert ca.pem https://addify.app/ | grep -c '__probe.js')"
          curl -s --cacert ca.pem https://www.tiktok.com/@replay.check/video/1 | grep -o '<title>[^<]*' || true
          if curl -s -m 5 -o /dev/null "https://$ALT/health"; then echo "SECOND NAME NOT BLOCKED"; exit 1; else echo "second name blocked"; fi
          if curl -s -m 5 -o /dev/null --resolve "addify.app:443:$REAL" https://addify.app/health; then echo "REAL HOST NOT DROPPED"; exit 1; else echo "real host dropped by pf"; fi
      - name: Walk each device
        run: |
          set +e
          APP=$(ls -d /tmp/app/*.app)
          XR=$(ls /tmp/agentdd/Build/Products/*.xctestrun 2>/dev/null | head -1)
          echo '${{ matrix.specs }}' | tr '|' '\n' > /tmp/specs.txt
          i=0
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            i=$((i+1)); rt="${spec%%:*}"; dev="${spec#*:}"
            tag="$(echo "$dev" | tr -cd 'A-Za-z0-9')-$(echo "$rt" | tr -d '.')"
            mkdir -p "out/$tag"
            python3 - "$dev" "$rt" "${{ matrix.platform }}" > /tmp/udid.txt 2> "out/$tag/pick.txt" <<'EOF'
          import json, subprocess, sys
          want, rv, plat = sys.argv[1], sys.argv[2], sys.argv[3]
          d = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j"]))
          pref = "com.apple.CoreSimulator.SimRuntime.%s-" % plat
          rts = [r for r in d["runtimes"] if r.get("isAvailable") and r["identifier"].startswith(pref)]
          print("runtimes:", [(r["name"], r.get("buildversion")) for r in rts], file=sys.stderr)
          rts = [r for r in rts if r["version"] == rv or r["version"].startswith(rv + ".")]
          dts = [t for t in d["devicetypes"] if t["name"] == want]
          if not dts: sys.exit("no device type " + want)
          for rt in rts:
              sup = [t.get("identifier") for t in rt.get("supportedDeviceTypes", [])]
              if sup and dts[0]["identifier"] not in sup:
                  print("runtime", rt["name"], rt.get("buildversion"), "does not list", want, file=sys.stderr); continue
              u = subprocess.check_output(["xcrun", "simctl", "create", "nh-" + want, dts[0]["identifier"], rt["identifier"]]).decode().strip()
              print(u); print("created", want, rt["name"], rt.get("buildversion"), file=sys.stderr); sys.exit(0)
          sys.exit("no runtime %s with %s" % (rv, want))
          EOF
            UDID=$(cat /tmp/udid.txt); cat "out/$tag/pick.txt"
            [ -z "$UDID" ] && { echo "skip $spec"; continue; }
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl keychain "$UDID" add-root-cert /tmp/kit/ca.pem
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 > /dev/null 2>&1 || true
            open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
            sleep 10
            xcrun simctl list devices | grep "$UDID" | tee "out/$tag/device.txt"
            xcrun simctl io "$UDID" enumerate > "out/$tag/io-enumerate.txt" 2>&1
            EXTRA=""; [ "${{ matrix.zoom }}" = "yes" ] && EXTRA="$EXTRA --zoom"; [ "${{ matrix.modes }}" = "yes" ] && EXTRA="$EXTRA --modes"
            XA=""; [ -n "$XR" ] && XA="--xctestrun $XR"
            perl -e 'alarm shift; exec @ARGV' 3000 python3 -u /tmp/kit/walk.py --udid "$UDID" --app "$APP" --out "out/$tag" --profile "${{ matrix.profile }}" --tag "$tag" $XA $EXTRA
            echo "walk exit $?"
            for d in internal external; do xcrun simctl io "$UDID" screenshot --display=$d "out/$tag/final-display-$d.png" > "out/$tag/final-display-$d.txt" 2>&1; done
            pkill -f "xcodebuild test-without-building" || true
            xcrun simctl shutdown "$UDID" || true
          done < /tmp/specs.txt
          true
      - name: Collect, scrub, shrink
        if: always()
        run: |
          set +e
          sudo cp -R /tmp/stubout out/stub 2>/dev/null; cp /tmp/stub.out out/stub/ 2>/dev/null
          mkdir -p out/crash; cp ~/Library/Logs/DiagnosticReports/Addify* out/crash/ 2>/dev/null
          sudo chown -R "$(whoami)" out
          rm -rf out/*/axreq
          ALT=$(cat /tmp/alt.txt 2>/dev/null); REAL=$(cat /tmp/real.txt 2>/dev/null); REAL6=$(cat /tmp/real6.txt 2>/dev/null)
          for f in $(grep -rIl . out 2>/dev/null); do
            sed -i '' -E -e "s#${ALT:-__none__}#<alt-host>#g" -e "s#${REAL:-__none__}#<server-ip>#g" -e "s#${REAL6:-__none__}#<server-ip6>#g" -e 's#[a-z0-9-]+\.sslip\.io#<alt-host>#g' "$f"
          done
          echo "leftover hits: $(grep -rIlE "${ALT:-__none__}|${REAL:-__none__}|sslip" out 2>/dev/null | wc -l)"
          find out -name '*.png' | while read f; do sips -s format jpeg -s formatOptions 62 -Z 1100 "$f" --out "${f%.png}.jpg" > /dev/null 2>&1 && rm "$f"; done
          du -sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-${{ matrix.key }}
          path: out
          retention-days: 2
