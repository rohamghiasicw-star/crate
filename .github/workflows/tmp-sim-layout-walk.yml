name: tmp sim layout walk
# Temporary. Builds the unmodified Release app for the simulator from the committed project
# (no entitlements, like an unsigned archive) and walks it on several simulator device types
# and runtimes against a local TLS stub (hosts file + a throwaway CA trusted only inside the
# simulator). The second compiled-in name is blackholed and the real host is dropped by pf.
# The branch is deleted after the run.
on:
  push:
    branches: [review-sim-ci-new-hardware-r4]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | tee xv.txt
          grep -q 17F113 xv.txt
      - name: Build Release for the simulator (committed project, no entitlements)
        run: |
          set -o pipefail
          xcodebuild -project ios/Addify.xcodeproj -scheme Addify -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS= build > build.log 2>&1 \
            || { grep -E 'error:' build.log | head -40; tail -60 build.log; exit 1; }
          APP=dd/Build/Products/Release-iphonesimulator/Addify.app
          fam=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/Info.plist" | tr -d ' \n')
          efam=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/PlugIns/AddifyShare.appex/Info.plist" | tr -d ' \n')
          {
            echo "source commit: $(git rev-parse HEAD)"
            echo "ios tree: $(git rev-parse HEAD:ios)"
            cat xv.txt
            echo "project: ios/Addify.xcodeproj (committed), configuration Release, CODE_SIGN_ENTITLEMENTS empty"
            echo "UIDeviceFamily app=$fam appex=$efam"
            for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion DTSDKName DTXcode DTXcodeBuild UIRequiresFullScreen; do
              echo "$k=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>&1)"; done
            echo "UISupportedInterfaceOrientations=$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$APP/Info.plist" | tr -d '\n ')"
            echo "SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD=$(grep -o 'SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD = [A-Z]*' ios/Addify.xcodeproj/project.pbxproj | sort -u | tr '\n' ' ')"
            echo "archs: $(lipo -archs "$APP/Addify")"
            echo "== entitlements app"; codesign -d --entitlements - "$APP" 2>&1 | grep -v '^Executable' || true
            echo "== entitlements appex"; codesign -d --entitlements - "$APP/PlugIns/AddifyShare.appex" 2>&1 | grep -v '^Executable' || true
            if codesign -d --entitlements - "$APP" 2>&1 | grep -q application-groups; then echo "app group PRESENT"; else echo "app group absent"; fi
          } | tee app-info.txt
          [ "$fam" = "Array{1}" ] && [ "$efam" = "Array{1}" ]
          grep -q "app group absent" app-info.txt
          ditto -c -k --keepParent "$APP" simapp.zip
      - uses: actions/upload-artifact@v4
        with:
          name: simapp
          path: |
            simapp.zip
            app-info.txt
          retention-days: 1

  run:
    needs: build
    runs-on: ${{ matrix.image }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: [{"key": "duo", "image": "xcode-27", "xcode": "27.1", "platform": "iOS", "profile": "iphone", "specs": "27.1:iPhone Duo", "inventory": "yes", "zoom": "yes"}, {"key": "small27", "image": "xcode-27", "xcode": "27.1", "platform": "iOS", "profile": "iphone", "specs": "27.0:iPhone 17e", "zoom": "yes"}, {"key": "ipad272", "image": "xcode-27", "xcode": "27.2", "platform": "iOS", "profile": "ipad", "specs": "27.2:iPad mini (A17 Pro)|27.2:iPad Pro 13-inch (M5)", "fetch": "yes", "modes": "yes"}, {"key": "vision", "image": "xcode-27", "xcode": "27.1", "platform": "xrOS", "profile": "vision", "specs": "27.0:Apple Vision Pro"}, {"key": "ios17", "image": "macos-14", "xcode": "16.2", "platform": "iOS", "profile": "iphone", "specs": "16.4:iPhone SE (3rd generation)|16.0:iPhone SE (3rd generation)|17.0:iPhone SE (3rd generation)", "fetch16": "yes", "zoom": "yes"}, {"key": "ios18", "image": "macos-14", "xcode": "16.2", "platform": "iOS", "profile": "iphone", "specs": "18.1:iPhone 16"}]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simapp
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Unpack app and kit
        env:
          XC: ${{ matrix.xcode }}
