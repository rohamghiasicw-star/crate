name: tmp sim stress ios27

# Temporary simulator check. Builds the iOS app the same way as the shipped configuration
# (Xcode 26.6, Release, simulator SDK, entitlements blanked, iPhone-only), then stresses it on
# iOS 27.x simulators against a local stand-in server on the runner: WebKit process kills,
# memory warnings, repeated share-sheet use, background/foreground cycles, rotation. Engine
# host names and addresses are read at run time and never written to the log or the
# artifacts. Nothing is signed, uploaded or deployed.

on:
  push:
    branches: [review-sim-ci-crash-resilience-ios27-r4]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build the app (Release, simulator, committed project, entitlements blanked)
        run: |
          test ! -e ios/Addify.xcodeproj/project.pbxproj.orig
          xcodebuild -project ios/Addify.xcodeproj -scheme Addify -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" \
            build > build.log 2>&1 || { tail -60 build.log; exit 1; }
          app=dd/Build/Products/Release-iphonesimulator/Addify.app
          echo "commit $(git rev-parse HEAD) ios tree $(git rev-parse HEAD:ios)" | tee app-info.txt
          echo "xcode $(xcodebuild -version | tr '\n' ' ')" | tee -a app-info.txt
          echo "configuration Release, project ios/Addify.xcodeproj (committed), CODE_SIGN_ENTITLEMENTS=\"\"" | tee -a app-info.txt
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion DTSDKName DTXcode DTXcodeBuild MinimumOSVersion UIDeviceFamily; do
            echo "$k: $(plutil -extract $k json -o - "$app/Info.plist" 2>/dev/null)" | tee -a app-info.txt
          done
          echo "appex UIDeviceFamily: $(plutil -extract UIDeviceFamily json -o - "$app/PlugIns/AddifyShare.appex/Info.plist" 2>/dev/null)" | tee -a app-info.txt
          (codesign -d --entitlements - --xml "$app" 2>&1 || true) | tee -a app-info.txt; echo | tee -a app-info.txt
          (codesign -d --entitlements - --xml "$app/PlugIns/AddifyShare.appex" 2>&1 || true) | tee -a app-info.txt; echo | tee -a app-info.txt
          if grep -q "group.com.addify.app" app-info.txt; then echo "app group PRESENT" | tee -a app-info.txt; exit 1; else echo "app group absent" | tee -a app-info.txt; fi
          fam=$(plutil -extract UIDeviceFamily json -o - "$app/Info.plist")
          [ "$fam" = "[1]" ] || { echo "UIDeviceFamily is $fam, expected [1]"; exit 1; }
          xb=$(plutil -extract DTXcodeBuild raw -o - "$app/Info.plist")
          [ "$xb" = "17F113" ] || { echo "DTXcodeBuild is $xb, expected 17F113"; exit 1; }
          echo "ASSERTED: UIDeviceFamily [1], DTXcodeBuild 17F113, no app group" | tee -a app-info.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" Addify.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            Addify.zip
            app-info.txt
          retention-days: 3

  stress:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: iphone-kills
            fetch: 'no'
            device: 'iPhone 17 Pro Max'
            runtime: '27.0'
            role: 'iphone17pm-270'
            tests: 'test00_setup test11_home_WebContent test12_home_GPU test13_home_Networking test21_scan_WebContent test22_scan_GPU test23_scan_Networking test31_result_WebContent test32_result_GPU test33_result_Networking test41_paywall_WebContent test42_paywall_GPU test43_paywall_Networking test51_terms_WebContent test52_terms_GPU test53_terms_Networking test61_safari_WebContent test62_safari_GPU test63_safari_Networking test71_bg_WebContent test72_bg_GPU test73_bg_Networking test81_netDuringLoad testZ9_end'
          - shard: ipad-kills
            fetch: 'yes'
            device: 'iPad Air 11-inch (M3)'
            runtime: '27.2'
            role: 'ipadairm3-272'
            tests: 'test00_setup test11_home_WebContent test12_home_GPU test13_home_Networking test21_scan_WebContent test22_scan_GPU test23_scan_Networking test31_result_WebContent test32_result_GPU test33_result_Networking test41_paywall_WebContent test42_paywall_GPU test43_paywall_Networking test51_terms_WebContent test52_terms_GPU test53_terms_Networking test61_safari_WebContent test62_safari_GPU test63_safari_Networking test71_bg_WebContent test72_bg_GPU test73_bg_Networking test81_netDuringLoad testZ9_end'
          - shard: iphone-stress
            fetch: 'no'
            device: 'iPhone 17 Pro Max'
            runtime: '27.0'
            role: 'iphone17pm-270'
            tests: 'test00_setup testS1_memwarn testS2_share20 testS3_bgfg20 testS4_rotate testS5_bg10min testZ9_end'
          - shard: ipad-stress
            fetch: 'yes'
            device: 'iPad Air 11-inch (M3)'
            runtime: '27.2'
            role: 'ipadairm3-272'
            tests: 'test00_setup testS1_memwarn testS2_share20 testS3_bgfg20 testS4_rotate testS5_bg10min testZ9_end'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2_Release_Candidate.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          sw_vers
          xcrun simctl list runtimes
      - name: Fetch the iOS 27.2 simulator runtime
        if: matrix.fetch == 'yes'
        timeout-minutes: 60
        continue-on-error: true
        run: |
          t=$(date +%s)
          xcodebuild -downloadPlatform iOS > dl.log 2>&1 && rc=0 || rc=$?
          echo "downloadPlatform rc=$rc after $(( $(date +%s) - t )) s"
          tr '\r' '\n' < dl.log | grep -v '^ *$' | tail -6
          xcrun simctl list runtimes
      - name: Unpack the kit, build the page, the UI agent
