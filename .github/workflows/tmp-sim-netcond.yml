name: tmp sim network conditions

# Temporary simulator check. Builds the iOS app the same way as the shipped configuration
# (Xcode 26.6, Release, simulator SDK, entitlements blanked, iPhone-only), then walks it on
# iOS 27.x simulators against a local stand-in server on the runner while the link to that
# stand-in is slowed, made lossy or cut. Engine host names and addresses are read at run time
# and never written to the log or the artifacts. Nothing is signed, uploaded or deployed.

on:
  push:
    branches: [review-sim-ci-network-adversity-ios27-r4]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build the app (Release, simulator, committed project, entitlements blanked)
        run: |
          test ! -e ios/Addify.xcodeproj/project.pbxproj.orig
          xcodebuild -project ios/Addify.xcodeproj -scheme Addify -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" \
            build > build.log 2>&1 || { tail -60 build.log; exit 1; }
          app=dd/Build/Products/Release-iphonesimulator/Addify.app
          echo "commit $(git rev-parse HEAD) ios tree $(git rev-parse HEAD:ios)" | tee app-info.txt
          echo "xcode: $(xcodebuild -version | tr '\n' ' ')" | tee -a app-info.txt
          echo "git status ios: [$(git status --porcelain ios | tr '\n' ' ')]" | tee -a app-info.txt
          for k in CFBundleShortVersionString CFBundleVersion DTSDKName DTXcode DTXcodeBuild MinimumOSVersion UIDeviceFamily; do
            echo "$k: $(plutil -extract $k json -o - "$app/Info.plist" 2>/dev/null)" | tee -a app-info.txt
          done
          echo "appex UIDeviceFamily: $(plutil -extract UIDeviceFamily json -o - "$app/PlugIns/AddifyShare.appex/Info.plist" 2>/dev/null)" | tee -a app-info.txt
          (codesign -d --entitlements - --xml "$app" 2>&1 || true) | tee -a app-info.txt; echo | tee -a app-info.txt
          (codesign -d --entitlements - --xml "$app/PlugIns/AddifyShare.appex" 2>&1 || true) | tee -a app-info.txt; echo | tee -a app-info.txt
          if grep -q "group.com.addify.app" app-info.txt; then echo "app group PRESENT" | tee -a app-info.txt; else echo "app group absent" | tee -a app-info.txt; fi
          fam=$(plutil -extract UIDeviceFamily json -o - "$app/Info.plist")
          [ "$fam" = "[1]" ] || { echo "UIDeviceFamily is $fam, expected [1]"; exit 1; }
          xb=$(plutil -extract DTXcodeBuild raw -o - "$app/Info.plist")
          [ "$xb" = "17F113" ] || { echo "DTXcodeBuild is $xb, expected 17F113"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" Addify.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            Addify.zip
            app-info.txt
          retention-days: 1

  walk:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: iphone
            fetch: 'no'
            device: 'iPhone 17 Pro Max'
            runtime: '27.0'
            role: 'iphone17pm-270'
            tests: 'testB00_setup testB01_drop10_base testB02_drop10_hunt testB03_blackhole60_base testB04_blackhole60_cancel testB05_blackhole60_hunt testB06_rst20_base testB07_rst20_hunt testB08_search_blackhole testB09_listen_blackhole testB10_paywall_blackhole testB11_paywall_rst testB12_profile_legal_drop10 testB13_delete_rst testB14_delete_blackhole testB15_dns_delay testA1_3g testA2_hilat testA3_lossy testA4_verybad testZ_final'
          - shard: ipad
            fetch: 'yes'
            device: 'iPad Air 11-inch (M3)'
            runtime: '27.2'
            role: 'ipadairm3-272'
            tests: 'testB00_setup testB01_drop10_base testB02_drop10_hunt testB03_blackhole60_base testB04_blackhole60_cancel testB05_blackhole60_hunt testB06_rst20_base testB07_rst20_hunt testB08_search_blackhole testB09_listen_blackhole testB10_paywall_blackhole testB11_paywall_rst testB12_profile_legal_drop10 testB13_delete_rst testB14_delete_blackhole testB15_dns_delay testA1_3g testA4_verybad testZ_final'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2_Release_Candidate.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          sw_vers
          xcrun simctl list runtimes
      - name: Fetch the iOS 27.2 simulator runtime
        if: matrix.fetch == 'yes'
        timeout-minutes: 60
        continue-on-error: true
        run: |
          t=$(date +%s)
          xcodebuild -downloadPlatform iOS > dl.log 2>&1 && rc=0 || rc=$?
          echo "downloadPlatform rc=$rc after $(( $(date +%s) - t )) s"
          tr '\r' '\n' < dl.log | grep -v '^ *$' | tail -6
          xcrun simctl list runtimes
