          $XG generate --spec kit/agent/project.yml --project kit/agent
          xcodebuild build-for-testing -project kit/agent/Agent.xcodeproj -scheme AgentUITests \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath agentdd ARCHS=arm64 ONLY_ACTIVE_ARCH=NO > agent-build.log 2>&1 \
            || { grep -E 'error:' agent-build.log | head -30; tail -40 agent-build.log; exit 1; }
          ls agentdd/Build/Products
      - name: Route the engine name to the local stand-in, drop the real address
        run: |
          APP=app/Addify.app
          ALT=$(strings -a "$APP/Addify" | grep -Eo 'https://[0-9]{1,3}(-[0-9]{1,3}){3}\.[a-z.]+' | head -1 | sed 's#https://##')
          [ -n "$ALT" ] && echo "::add-mask::$ALT"
          REAL=$(dig +short @1.1.1.1 addify.app A | grep -E '^[0-9]+(\.[0-9]+){3}$' | tail -1)
          [ -n "$REAL" ] && echo "::add-mask::$REAL"
          DASH=$(echo "$REAL" | tr '.' '-'); [ -n "$DASH" ] && echo "::add-mask::$DASH"
          [ -n "$ALT" ] && [ -n "$REAL" ] || { echo "could not read the names"; exit 1; }
          SLD=$(echo "$ALT" | awk -F. '{print $(NF-1)}'); [ -n "$SLD" ] && echo "::add-mask::$SLD"
          printf '%s\n%s\n%s\n%s\n' "$ALT" "$REAL" "$DASH" "$SLD" > /tmp/fx/secrets.txt
          printf '%s\n' "$REAL" > /tmp/fx/real.txt
          sudo ifconfig lo0 mtu 1500; ifconfig lo0 | head -1
          printf 'set block-policy drop\nblock drop quick inet from any to %s\npass quick on lo0 all no state\npass all\n' "$REAL" > /tmp/pf.rules
          sudo pfctl -E > /dev/null 2>&1 || true; sudo pfctl -q -f /tmp/pf.rules
          printf '127.0.0.1 addify.app\n::1 addify.app\n' | sudo tee -a /etc/hosts > /dev/null
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          cd /tmp/fx
          cat > ca.cnf <<'CNF'
          [req]
          distinguished_name=dn
          x509_extensions=v3
          prompt=no
          [dn]
          CN=Throwaway Sim CA
          [v3]
          basicConstraints=critical,CA:TRUE
          keyUsage=critical,keyCertSign,cRLSign
          subjectKeyIdentifier=hash
          CNF
          cat > srv.ext <<'CNF'
          basicConstraints=CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:addify.app
          CNF
          openssl req -x509 -new -nodes -newkey rsa:2048 -sha256 -days 30 -keyout ca.key -out ca.pem -config ca.cnf 2>/dev/null
          openssl req -new -nodes -newkey rsa:2048 -sha256 -keyout srv.key -out srv.csr -subj "/CN=addify.app" 2>/dev/null
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out srv.pem -days 20 -sha256 -extfile srv.ext 2>/dev/null
          mkdir -p "$GITHUB_WORKSPACE/out/stub"
          sudo nohup python3 -u "$GITHUB_WORKSPACE/kit/stub.py" /tmp/fx "$GITHUB_WORKSPACE/out/stub" --tls /tmp/fx/srv.pem /tmp/fx/srv.key --port 443 --probe-port 8443 --pages "$GITHUB_WORKSPACE/engine/pages" > /tmp/stub.out 2>&1 &
          sleep 3; cat /tmp/stub.out
          N="$GITHUB_WORKSPACE/out/net-checks.txt"
          echo "== checks" | tee "$N"
          curl -s --cacert ca.pem -D - -o /dev/null https://addify.app/health | grep -iE '^HTTP|x-stub' | tee -a "$N"
          curl -s --cacert ca.pem -o /dev/null -w "terms %{http_code}\n" https://addify.app/terms | tee -a "$N"
          curl -s --cacert ca.pem -o /dev/null -w "probe port %{http_code}\n" https://addify.app:8443/health | tee -a "$N"
          t=$(date +%s); rc=0; curl -s -m 12 -o /dev/null "https://$ALT/health" || rc=$?
          echo "second name: curl exit $rc after $(( $(date +%s) - t )) s (28 = timed out, silent drop)" | tee -a "$N"
          [ "$rc" = "28" ] || { echo "second name is not dropped"; exit 1; }
          rc=0; curl -s -m 6 -o /dev/null --resolve "addify.app:443:$REAL" https://addify.app/health || rc=$?
          echo "real address: curl exit $rc" | tee -a "$N"
          [ "$rc" = "28" ] || { echo "real address not dropped"; exit 1; }
          cat /etc/pf.conf | grep -c anchor | sed 's/^/pf.conf anchors: /' | tee -a "$N"
      - name: Walk
        timeout-minutes: 220
        run: bash kit/run.sh "${{ matrix.device }}" "${{ matrix.runtime }}" "${{ matrix.role }}" "${{ matrix.tests }}"
      - name: Scrub and shrink
        if: always()
        run: |
          set +e
          sudo chown -R "$(whoami)" out
          cp /tmp/stub.out out/stub/ 2>/dev/null
          cp app-info.txt out/ 2>/dev/null
          sudo pfctl -vsr 2>/dev/null | sed -e "s/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/<addr>/g" > out/pf-final.txt
          rm -rf out/req
          for f in $(find out/shots -name '*.png'); do sips -s format jpeg -s formatOptions 60 -Z 1100 "$f" --out "${f%.png}.jpg" > /dev/null 2>&1 && rm "$f"; done
          n=0; for f in out/frames/*.jpg; do sips -s formatOptions 45 -Z 460 "$f" > /dev/null 2>&1; n=$((n+1)); done; echo "frames: $n"
          while read -r s; do
            [ -z "$s" ] && continue
            for f in $(grep -rIl -F "$s" out 2>/dev/null); do LC_ALL=C sed -i '' "s#${s}#<scrubbed>#g" "$f"; done
          done < /tmp/fx/secrets.txt
          left=0
          while read -r s; do
            [ -z "$s" ] && continue
            for f in $(grep -ral -F "$s" out 2>/dev/null); do echo "leak removed: $f"; rm -f "$f"; left=$((left+1)); done
          done < /tmp/fx/secrets.txt
          echo "files removed for leaks: $left"
          du -sh out out/frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net-${{ matrix.shard }}
          path: out
          retention-days: 2
