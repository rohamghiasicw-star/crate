name: tmp launch timing

# Temporary simulator check. Builds the iOS app the same way as the shipped configuration
# (Xcode 26.6, Release, simulator SDK, entitlements blanked, iPhone-only), then times fresh
# installs from launch to the first screen on iOS 26.5, 27.0 and iPadOS 27.2 simulators against
# a local stand-in server on the runner. Engine host names and addresses are read at run time,
# masked, and scrubbed from the artifacts. Nothing is signed, uploaded or deployed.

on:
  push:
    branches: [review-sim-ci-launch-timeout-ios27-r4]

permissions:
  contents: read

env:
  TZ: UTC
  CYCLES: '2'

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build the app (Release, simulator, committed project, entitlements blanked)
        run: |
          xcodebuild -project ios/Addify.xcodeproj -scheme Addify -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" \
            build > build.log 2>&1 || { tail -60 build.log; exit 1; }
          app=dd/Build/Products/Release-iphonesimulator/Addify.app
          { echo "commit $(git rev-parse HEAD) ios tree $(git rev-parse HEAD:ios)"
            xcodebuild -version | tr '\n' ' '; echo
            echo "configuration: Release, iphonesimulator, committed ios/Addify.xcodeproj, CODE_SIGN_ENTITLEMENTS=\"\""; } | tee app-info.txt
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion DTSDKName DTXcode DTXcodeBuild MinimumOSVersion UIDeviceFamily; do
            echo "$k: $(plutil -extract $k json -o - "$app/Info.plist" 2>/dev/null)" | tee -a app-info.txt
          done
          echo "appex UIDeviceFamily: $(plutil -extract UIDeviceFamily json -o - "$app/PlugIns/AddifyShare.appex/Info.plist" 2>/dev/null)" | tee -a app-info.txt
          echo "app entitlements:" | tee -a app-info.txt
          (codesign -d --entitlements - --xml "$app" 2>&1 || true) | tee -a app-info.txt; echo | tee -a app-info.txt
          echo "appex entitlements:" | tee -a app-info.txt
          (codesign -d --entitlements - --xml "$app/PlugIns/AddifyShare.appex" 2>&1 || true) | tee -a app-info.txt; echo | tee -a app-info.txt
          if grep -q "group.com.addify.app" app-info.txt; then echo "app group PRESENT" | tee -a app-info.txt; else echo "app group absent" | tee -a app-info.txt; fi
          fam=$(plutil -extract UIDeviceFamily json -o - "$app/Info.plist")
          [ "$fam" = "[1]" ] || { echo "UIDeviceFamily is $fam, expected [1]"; exit 1; }
          xb=$(plutil -extract DTXcodeBuild raw -o - "$app/Info.plist")
          [ "$xb" = "17F113" ] || { echo "DTXcodeBuild is $xb, expected 17F113"; exit 1; }
          sdk=$(plutil -extract DTSDKName raw -o - "$app/Info.plist")
          [ "$sdk" = "iphonesimulator26.5" ] || { echo "DTSDKName is $sdk"; exit 1; }
          grep -q "app group absent" app-info.txt || exit 1
          echo "ASSERT OK: UIDeviceFamily [1], DTXcodeBuild 17F113, iphonesimulator26.5, no app group" | tee -a app-info.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" Addify.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            Addify.zip
            app-info.txt
          retention-days: 2

  measure:
    needs: build
    runs-on: ${{ matrix.image }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: r265-A, image: macos-26, xcode: '26.6', fetch: '', device: 'iPhone 17 Pro Max', runtime: '26.5', plans: 'warm:a erase:a' }
          - { job: r270-A, image: xcode-27, xcode: '27.2', fetch: '', device: 'iPhone 17 Pro Max', runtime: '27.0', plans: 'warm:a erase:a' }
          - { job: r272-A, image: xcode-27, xcode: '27.2', fetch: '27.2', device: 'iPad Air 11-inch (M3)', runtime: '27.2', plans: 'warm:a erase:a' }
          - { job: r265-B, image: macos-26, xcode: '26.6', fetch: '', device: 'iPhone 17 Pro Max', runtime: '26.5', plans: 'erase:b,c' }
          - { job: r270-B, image: xcode-27, xcode: '27.2', fetch: '', device: 'iPhone 17 Pro Max', runtime: '27.0', plans: 'erase:b,c' }
          - { job: r272-B, image: xcode-27, xcode: '27.2', fetch: '27.2', device: 'iPad Air 11-inch (M3)', runtime: '27.2', plans: 'erase:b,c' }
          - { job: r265-C, image: macos-26, xcode: '26.6', fetch: '', device: 'iPhone 17 Pro Max', runtime: '26.5', plans: 'erase:d,e' }
          - { job: r270-C, image: xcode-27, xcode: '27.2', fetch: '', device: 'iPhone 17 Pro Max', runtime: '27.0', plans: 'erase:d,e' }
          - { job: r272-C, image: xcode-27, xcode: '27.2', fetch: '27.2', device: 'iPad Air 11-inch (M3)', runtime: '27.2', plans: 'erase:d,e' }
          - { job: x265-A, image: xcode-27, xcode: '27.2', fetch: '26.5', device: 'iPhone 17 Pro Max', runtime: '26.5', plans: 'warm:a erase:a' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .
      - name: Select Xcode
        run: |
          mkdir -p out
          ls -d /Applications/Xcode*.app | tee out/xcodes.txt
          X=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | head -1)
          sudo xcode-select -s "$X/Contents/Developer"
          { xcodebuild -version; sw_vers; sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string; } | tee out/env.txt
      - name: Fetch simulator runtime
        if: matrix.fetch != ''
        timeout-minutes: 45
        continue-on-error: true
        run: |
          if xcrun simctl list runtimes | grep -q "iOS ${{ matrix.fetch }} "; then echo present; exit 0; fi
          t=$(date +%s)
          if [ "${{ matrix.fetch }}" = "27.2" ]; then xcodebuild -downloadPlatform iOS > dl.log 2>&1 && rc=0 || rc=$?
          else
            Y=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | head -1)
            if [ -n "$Y" ]; then DEVELOPER_DIR="$Y/Contents/Developer" xcodebuild -downloadPlatform iOS > dl.log 2>&1 && rc=0 || rc=$?
            else xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.fetch }} > dl.log 2>&1 && rc=0 || rc=$?; fi
          fi
          echo "downloadPlatform rc=$rc after $(( $(date +%s) - t )) s" | tee -a out/env.txt
          tr '\r' '\n' < dl.log | grep -v '^ *$' | tail -4 | tee -a out/env.txt
      - name: Unpack the kit, build the page
