      - name: Runner network (stand-in server, hosts, pf drop, captures)
        run: |
          sudo bash kit/net.sh init "$PWD/app/Addify.app" "$PWD/kit" | tee out/net-init.txt
          while read -r s; do [ -n "$s" ] && echo "::add-mask::$s"; done < /tmp/fx/secrets.txt
          . /tmp/fx/net.env
          {
            echo "== checks $(date -u +%FT%TZ)"
            sudo bash kit/net.sh set a | sed -e 's/[0-9]\{1,3\}\(\.[0-9]\{1,3\}\)\{3\}/<ip>/g'
            curl -s --cacert /tmp/fx/ca.pem -o /dev/null -w "engine name -> stub: %{http_code} in %{time_total}s\n" https://addify.app/health
            t=$(date +%s); rc=0; curl -s -m 12 -o /dev/null "https://$ALT/health" || rc=$?
            echo "second name: curl exit $rc after $(( $(date +%s) - t )) s (28 = timed out, silent drop)"
            [ "$rc" = "28" ] || { echo "second name is not black-holed"; exit 1; }
            rc=0; curl -s -m 6 -o /dev/null --resolve "addify.app:443:$REAL" https://addify.app/health || rc=$?
            echo "real address: curl exit $rc"
            [ "$rc" = "28" ] || { echo "real address not dropped"; exit 1; }
            sudo bash kit/net.sh set b > /dev/null
            curl -s --cacert /tmp/fx/ca.pem -o /dev/null -w "variant b, second name -> stub: %{http_code}\n" "https://$ALT/health" || echo "variant b check failed"
            sudo bash kit/net.sh set c > /dev/null
            curl -s --cacert /tmp/fx/ca.pem -o /dev/null -w "variant c, engine name -> alias stub: %{http_code}\n" https://addify.app/health || echo "variant c check failed"
            sudo bash kit/net.sh set d > /dev/null
            rc=0; curl -s -m 6 -o /dev/null https://api.github.com/ || rc=$?
            echo "variant d, directory host: curl exit $rc (28 = dropped)"
            sudo bash kit/net.sh set e > /dev/null
            curl -s -6 --cacert /tmp/fx/ca.pem -o /dev/null -w "variant e, engine name over ::1: %{http_code}\n" https://addify.app/health || echo "variant e check failed"
            sudo bash kit/net.sh set restore > /dev/null
            rc=0; curl -s -m 8 -o /dev/null -w "directory host reachable: %{http_code}\n" https://api.github.com/gists/d63fcb85b88d9a8f12e943605dd0a078 || rc=$?
            echo "sims booted before the run: $(xcrun simctl list devices booted | grep -c Booted || true)"
          } 2>&1 | tee out/net-checks.txt
      - name: Launch cycles
        timeout-minutes: 300
        run: |
          xcrun simctl shutdown all || true
          i=0
          for pn in ${{ matrix.plans }}; do
            p="${pn%@*}"; n="${pn#*@}"
            i=$((i+1)); d="out/p$i-${p/:/-}"; d="${d//,/}"
            python3 -u kit/driver.py --device "${{ matrix.device }}" --runtime "${{ matrix.runtime }}" --plan "$p" --n "$n" \
              --out "$d" --app "$PWD/app/Addify.app" 2>&1 | tee "$d.log" || true
          done
          sudo bash kit/net.sh set restore || true
          python3 kit/summarize.py out/*/cycles.jsonl | tee out/summary.txt
      - name: Scrub and shrink
        if: always()
        run: |
          set +e
          sudo chown -R "$(whoami)" out /tmp/fx
          python3 kit/shrink.py out
          mkdir -p out/net
          for f in stub.jsonl lo0.txt alias.txt pflog.txt iostat.txt stub-L4.out stub-L6.out stub-AL.out; do cp "/tmp/fx/$f" out/net/ 2>/dev/null; done
          sudo pfctl -vsr 2>/dev/null > out/net/pf-final.txt
          for g in $(find out -name '*.gz'); do gunzip -f "$g"; done
          while read -r s; do
            [ -z "$s" ] && continue
            for f in $(grep -rIil -F "$s" out 2>/dev/null); do S="$s" perl -pi -e 's/\Q$ENV{S}\E/<scrubbed>/gi' "$f"; done
          done < /tmp/fx/secrets.txt
          left=0
          while read -r s; do
            [ -z "$s" ] && continue
            for f in $(grep -rail -F "$s" out 2>/dev/null); do echo "leak removed: $f"; rm -f "$f"; left=$((left+1)); done
          done < /tmp/fx/secrets.txt
          echo "files removed for leaks: $left"
          for f in $(find out -name '*.txt' -size +20M); do gzip -9 "$f"; done
          for f in $(find out -name 'devlog.txt'); do gzip -9 "$f"; done
          du -sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lt-${{ matrix.job }}
          path: out
          retention-days: 2
