# Device-launch lab: accessibility observer. NOT part of the shipped app.
#
# A UI test bundle can only read another app's accessibility tree from a host app of its own,
# so this holds a one-screen ObserverHost and the ObserverUITests bundle. The one test,
# AXServer.testServe, never taps anything: it waits for request files from the host-side
# launch loop and answers each with com.addify.app's state and accessibility tree, so every
# launch gets an accessibility dump without restarting xcodebuild per launch.
#
# Generated on the runner: xcodegen generate --spec reviewsim/launch/observer/project.yml
name: Observer
options:
  bundleIdPrefix: com.addify.reviewsim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ObserverHost:
    type: application
    platform: iOS
    sources: [ObserverHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addify.reviewsim.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ObserverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ObserverUITests]
    dependencies:
      - target: ObserverHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addify.reviewsim.uitests
        TEST_TARGET_NAME: ObserverHost
schemes:
  ObserverUITests:
    build:
      targets:
        ObserverHost: all
        ObserverUITests: [test]
    test:
      config: Debug
      targets: [ObserverUITests]
