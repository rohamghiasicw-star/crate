<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150E33">
<title>Addify — name the sound in any clip</title>
<style>
:root{
  --bg:#1B1140; --bg2:#241650;
  --card:#3A2A78; --raise:#4A3894; --raise2:#5643A8;
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.20);
  --text:#FFFFFF; --muted:#CFC4F5; --faint:#A294DC;
  --accent:#5B4BE8; --accent2:#8172FF; --accent-press:#4A3AD4; --on-accent:#FFFFFF;
  --signal:#A855F7; --cool:#2DD4BF; --good:#2ED8A7;
  --r-card:26px; --r-mid:18px; --r-pill:999px;
  --spring:cubic-bezier(.2,.9,.25,1.15);
  --shadow:0 24px 60px rgba(8,4,30,.55);
}
:root[data-theme="light"]{
  --bg:#EFEBFF; --bg2:#F7F5FF;
  --card:#FFFFFF; --raise:#F1EDFF; --raise2:#E6E0FF;
  --line:rgba(30,18,80,.10); --line2:rgba(30,18,80,.18);
  --text:#1A1140; --muted:#5F5391; --faint:#8A7FBC;
  --accent:#5B4BE8; --accent2:#7360FF; --accent-press:#4A3AD4; --on-accent:#FFFFFF;
  --signal:#8B3DE8; --cool:#12A594; --good:#0E9F6E;
  --shadow:0 20px 50px rgba(60,40,140,.16);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EFEBFF; --bg2:#F7F5FF; --card:#FFFFFF; --raise:#F1EDFF; --raise2:#E6E0FF;
    --line:rgba(30,18,80,.10); --line2:rgba(30,18,80,.18);
    --text:#1A1140; --muted:#5F5391; --faint:#8A7FBC;
    --signal:#8B3DE8; --cool:#12A594; --good:#0E9F6E;
    --shadow:0 20px 50px rgba(60,40,140,.16);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(80% 50% at 50% 0%, color-mix(in oklab,var(--accent) 30%,transparent), transparent 66%);
  background-attachment:fixed;
  display:flex; justify-content:center;
  padding:22px 16px 40px;
}
::selection{background:var(--accent); color:#fff}
:focus-visible{outline:2px solid var(--accent2); outline-offset:3px; border-radius:10px}
button,input{font:inherit; color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- the phone card ---------- */
.app{
  width:100%; max-width:400px; background:var(--card); border-radius:32px;
  border:1px solid var(--line); box-shadow:var(--shadow);
  padding:20px 18px 24px; min-height:660px; display:flex; flex-direction:column;
  animation:rise .5s var(--spring) both; overflow:hidden;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.5);opacity:0}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* one screen at a time */
.screen{display:none; flex:1; flex-direction:column; animation:fade .35s var(--spring) both}
.app[data-state="idle"] #s-home{display:flex}
.app[data-state="scanning"] #s-scan{display:flex}
.app[data-state="locked"] #s-match{display:flex}

/* screen header: left btn | centred title | right btn */
.hd{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:6px}
.hd .ttl{text-align:center;font-size:15px;font-weight:650;letter-spacing:-.01em}
.hd .brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:19px;letter-spacing:-.02em;
  grid-column:1/3;justify-self:start}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);
  background:var(--raise);transition:background .15s,color .15s}
.ib:hover{background:var(--raise2);color:var(--text)}
.ib.plain{background:none}.ib.plain:hover{background:var(--raise)}

/* ---------- orb ---------- */
.orbwrap{position:relative;width:190px;height:190px;display:grid;place-items:center;margin:0 auto}
.orbwrap .rg{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent2);opacity:0}
.app[data-state="scanning"] .rg{animation:ring 2.6s ease-out infinite}
.app[data-state="scanning"] .rg:nth-child(2){animation-delay:.87s}
.app[data-state="scanning"] .rg:nth-child(3){animation-delay:1.74s}
.orb{
  width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--accent2),var(--accent));
  box-shadow:0 16px 44px color-mix(in oklab,var(--accent) 60%,transparent);
  transition:transform .18s var(--spring)}
.orb:hover{transform:scale(1.04)} .orb:active{transform:scale(.96)}
.orb[disabled]{pointer-events:none}

/* ---------- home ---------- */
#s-home .mid{display:flex;flex-direction:column;align-items:center;gap:16px;padding:34px 0 8px}
.tap{text-align:center;font-size:14.5px;color:var(--muted);line-height:1.5;max-width:250px}
.tap b{color:var(--text);font-weight:640}
.err{font-size:13px;color:#FFC2C2;background:rgba(255,90,90,.16);border-radius:12px;padding:9px 12px;text-align:center}
.err[hidden]{display:none}
.form[hidden]{display:none}
.form{display:flex;align-items:center;gap:8px;width:100%;background:var(--raise);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:5px 5px 5px 14px;transition:border-color .16s,box-shadow .16s}
.form.focus{border-color:var(--accent2);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 22%,transparent)}
.form .lk{color:var(--faint);display:grid;place-items:center;flex:none}
.form input{flex:1;min-width:0;background:none;border:0;outline:none;padding:9px 0;font-size:14px;color:var(--text)}
.form input::placeholder{color:var(--faint)}
.go{background:var(--accent);color:var(--on-accent);border-radius:var(--r-pill);padding:9px 15px;font-weight:650;
  font-size:13.5px;flex:none;transition:background .15s,transform .12s}
.go:hover{background:var(--accent-press)} .go:active{transform:scale(.96)} .go[disabled]{opacity:.5;pointer-events:none}
.subacts{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--faint)}
.subacts button{color:var(--accent2);font-weight:600}
.subacts button:hover{text-decoration:underline}

/* ---------- scanning ---------- */
#s-scan{align-items:stretch;justify-content:flex-start}
#s-scan .mid{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:auto;margin-bottom:auto}
.listening{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-top:22px}
.sub{font-size:13.5px;color:var(--muted);text-align:center}
/* ---------- source chip + progress (scanning) ---------- */
.chip{display:flex;align-items:center;gap:10px;width:100%;background:var(--raise);border-radius:var(--r-mid);
  padding:11px 13px;border:1px solid var(--line);animation:pop .3s var(--spring) both}
.chip .ci{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,#F9407B,#B043E8)}
.chip .ct{min-width:0}
.chip .ct b{display:block;font-size:13.5px;font-weight:650}
.chip .ct span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{width:100%;height:4px;border-radius:99px;background:var(--raise);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0;width:34%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:slide 1.5s ease-in-out infinite}

.live{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;color:var(--muted);
  text-align:center;transition:opacity .2s}
.live[hidden]{display:none}
#scanbox:empty,#result:empty{display:none}
.live b{color:var(--text);font-weight:650}
.live .sp{display:inline-grid;place-items:center;flex:none}
.mono{font-variant-numeric:tabular-nums}

/* ---------- waveform ---------- */
canvas#wave{width:100%;height:56px;display:block;opacity:.9}
canvas.reccanvas{width:100%;height:86px;display:block;margin:14px 0 4px}

/* ---------- result card ---------- */
.card{animation:fade .4s var(--spring) both}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.art{width:150px;height:150px;border-radius:20px;object-fit:cover;display:block;
  box-shadow:0 14px 34px rgba(8,4,30,.4);animation:pop .4s var(--spring) both}
.art.ph{display:grid;place-items:center;background:linear-gradient(155deg,var(--accent2),var(--accent))}
.rtitle{margin:14px 0 0;font-size:26px;line-height:1.15;font-weight:750;letter-spacing:-.02em;text-wrap:balance}
.rartist{margin:2px 0 0;font-size:15px;color:var(--muted)}
.badge{margin-top:13px;display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:var(--r-pill);
  padding:10px 18px;font-size:13.5px;font-weight:600;line-height:1.35;max-width:100%}
.badge.orig{background:color-mix(in oklab,var(--good) 22%,transparent);color:var(--good)}
.clip{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.clip img{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none}
.clip .h{font-weight:600;color:var(--text)}

.sect{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:20px 0 9px}
.list{display:flex;flex-direction:column;gap:7px}
.trk{display:flex;align-items:center;gap:11px;background:var(--raise2);border-radius:14px;padding:11px 12px;
  border:1px solid transparent;transition:transform .12s,border-color .15s}
.trk:hover{transform:translateY(-1px);border-color:var(--line2)}
.trk.top{background:linear-gradient(120deg,color-mix(in oklab,var(--accent) 40%,var(--raise2)),var(--raise2));
  box-shadow:inset 3px 0 0 var(--accent2)}
.trk .pl{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.trk .tt{min-width:0;flex:1}
.trk .nm{font-size:13.5px;font-weight:640;line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.trk .mt{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:11.5px;color:var(--muted)}
.src{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
.src.soundcloud{background:rgba(255,85,0,.2);color:#FF8A4C}
.src.youtube{background:rgba(255,60,60,.2);color:#FF7A7A}
.trk .op{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:4px;flex:none}

/* ---------- playlist rows ---------- */
.plat{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.prow{display:flex;align-items:center;gap:11px;background:var(--raise2);border-radius:14px;padding:12px 13px;
  transition:transform .12s,background .15s}
.prow:hover{transform:translateY(-1px);background:var(--raise2);filter:brightness(1.08)}
.prow .pi{width:26px;height:26px;display:grid;place-items:center;flex:none}
.prow .pn{flex:1;font-size:14px;font-weight:600}
.prow .pp{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.prow.save{background:var(--accent);color:var(--on-accent);justify-content:center;gap:8px;font-weight:650}
.prow.save .pn{flex:none}
.prow.save.on{background:color-mix(in oklab,var(--good) 26%,var(--raise2));color:var(--good)}

.quotes{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.qh{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.quote{display:flex;gap:8px;font-size:13px;color:var(--muted);margin-bottom:7px;line-height:1.45}
.quote svg{flex:none;margin-top:3px;color:var(--faint)}

.note{text-align:center;padding:12px 8px}
.note b{display:block;font-size:16px;margin:12px 0 5px}
.note span{color:var(--muted);font-size:13.5px}

/* ---------- recent finds ---------- */
.finds{display:flex;flex-direction:column;gap:9px}
.fh{display:flex;align-items:center;justify-content:space-between}
.fh b{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.fh .acts{display:flex;gap:6px}
.fh button{font-size:12px;color:var(--muted);padding:5px 10px;border-radius:var(--r-pill);border:1px solid var(--line)}
.fh button:hover{color:var(--text);border-color:var(--line2)}
.saved{display:flex;align-items:center;gap:12px;background:var(--raise);border-radius:16px;padding:11px 13px;
  transition:transform .12s,background .15s}
.saved:hover{transform:translateY(-1px)}
.saved .sq{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.saved img{width:42px;height:42px;border-radius:12px;object-fit:cover;flex:none}
.saved .tt{flex:1;min-width:0}
.saved .nm{font-size:14px;font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved .mt{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved .rm{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex:none}
.saved .rm:hover{background:var(--raise2);color:var(--text)}
.empty{text-align:center;padding:26px 12px;border:1px dashed var(--line2);border-radius:var(--r-mid)}
.empty b{display:block;font-size:14.5px;margin:10px 0 4px}
.empty span{font-size:13px;color:var(--muted)}
.foot{text-align:center;font-size:11.5px;color:var(--faint);padding-top:2px}
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">

  <!-- ============ HOME ============ -->
  <section class="screen" id="s-home">
    <div class="hd">
      <div class="brand"><span id="mark"></span> Addify</div>
      <button class="ib" id="theme" title="Switch theme" aria-label="Switch theme"></button>
    </div>

    <div class="mid">
      <div class="orbwrap">
        <button class="orb" id="go" title="Scan" aria-label="Scan"></button>
      </div>
      <p class="tap">Paste a TikTok or Instagram link, or tap the orb to use your clipboard.</p>
      <form class="form" id="form" autocomplete="off">
        <span class="lk" id="ico-link"></span>
        <input id="url" type="text" placeholder="https://www.tiktok.com/..." aria-label="Clip link" spellcheck="false">
        <button class="go" type="submit" id="gobtn">Identify</button>
      </form>
      <div class="subacts">
        <button id="paste" type="button">Paste from clipboard</button>
        <span>·</span>
        <button id="example" type="button">Try an example</button>
      </div>
      <div class="err" id="err" hidden></div>
    </div>

    <div class="finds">
      <div class="fh">
        <b>Recent finds</b>
        <div class="acts"><button id="export">Export</button><button id="clear">Clear</button></div>
      </div>
      <div id="cratebody"></div>
    </div>
  </section>

  <!-- ============ SCANNING ============ -->
  <section class="screen" id="s-scan">
    <div class="hd">
      <button class="ib plain" id="cancel" title="Cancel" aria-label="Cancel"></button>
      <div class="ttl">Scanning</div>
    </div>
    <div id="scanbox"></div>
    <div class="mid">
      <div class="orbwrap">
        <span class="rg"></span><span class="rg"></span><span class="rg"></span>
        <div class="orb" id="orb2"></div>
      </div>
      <div class="listening" id="listening">Listening…</div>
      <div class="sub" id="live">Checking against edits and remixes</div>
    </div>
    <div class="prog"><i></i></div>
  </section>

  <!-- ============ MATCH ============ -->
  <section class="screen" id="s-match">
    <div class="hd">
      <button class="ib plain" id="back" title="Scan another" aria-label="Scan another"></button>
      <div class="ttl" id="matchttl">Match found</div>
      <button class="ib plain" id="share" title="Copy link" aria-label="Copy link"></button>
    </div>
    <div id="result"></div>
  </section>

  <canvas id="wave" hidden></canvas>
</div>

<script>
/* ---------- icons ---------- */
var IC={
  moon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>',
  sun:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>',
  link:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13.5a3.6 3.6 0 0 0 5.2.3l2.6-2.6a3.6 3.6 0 1 0-5.1-5.1l-1.3 1.3"/><path d="M14 10.5a3.6 3.6 0 0 0-5.2-.3l-2.6 2.6a3.6 3.6 0 1 0 5.1 5.1l1.3-1.3"/></svg>',
  scan:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13c2.4 0 2.4-7 4.8-7s2.4 12 4.8 12 2.4-9 4.8-9S19.8 13 21 13"/></svg>',
  play:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6l11-6.8z"/></svg>',
  open:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg>',
  plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>',
  save:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h11a1 1 0 0 1 1 1v15l-6.5-4-6.5 4V5a1 1 0 0 1 1-1z"/></svg>',
  savefill:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 3.5h11a1.5 1.5 0 0 1 1.5 1.5v15.6L12 16.3 5 20.6V5a1.5 1.5 0 0 1 1.5-1.5z"/></svg>',
  share:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="17.5" cy="6" r="2.4"/><circle cx="6.5" cy="12" r="2.4"/><circle cx="17.5" cy="18" r="2.4"/><path d="M8.7 10.9 15.3 7.2M8.7 13.1l6.6 3.7"/></svg>',
  bignote:'<svg width="58" height="58" viewBox="0 0 24 24" fill="#fff"><path d="M20 4.2v11.1a3.2 3.2 0 1 1-1.8-2.87V7.6l-7.4 1.66v8.05a3.2 3.2 0 1 1-1.8-2.87V6.9c0-.42.29-.78.7-.87l9.2-2.06c.56-.13 1.1.3 1.1.87z"/></svg>',
  note:'<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4.2v11.1a3.2 3.2 0 1 1-1.8-2.87V7.6l-7.4 1.66v8.05a3.2 3.2 0 1 1-1.8-2.87V6.9c0-.42.29-.78.7-.87l9.2-2.06c.56-.13 1.1.3 1.1.87z"/></svg>',
  rchev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6 15.5 12 9.5 18"/></svg>',
  chev:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15.5 18 9.5"/></svg>',

var ENGINE=(function(){try{var q=new URLSearchParams(location.search).get('engine'); if(q) return q.replace(/\/+$/,'');}catch(e){}

  var host=/tiktok\.com|vt\.tiktok/.test(u)?'tiktok':(/instagram\.com/.test(u)?'instagram':null); return {host:host,url:u};}
function plays(n){n=n||0; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M'; if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1)+'K'; return String(n);}
function hexToRgb(h){h=(h||'').replace('#',''); if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){t=Math.max(0,Math.min(1,t)); var A=hexToRgb(a),B=hexToRgb(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';}

/* ---------- waveform ---------- */
var NB=110, cvW=document.getElementById('wave');

function resample(a){if(!a||!a.length) return new Array(NB).fill(0); var o=new Array(NB);
  for(var i=0;i<NB;i++) o[i]=a[Math.min(a.length-1,Math.round(i*(a.length-1)/(NB-1)))]; return o;}
function setWaveData(w){if(!w||!w.amp){W.amp=[];return;}
  W.amp=resample(w.amp); W.lo=resample(w.lo); W.hi=resample(w.hi); W.mid=resample(w.mid||[]);
  W.centroid=w.centroid==null?.5:w.centroid; W.tilt=w.tilt||0; W.reverb=w.reverb||0;
  bassAmt=Math.max(0,Math.min(1,(W.tilt-19)/16)); bars=W.amp.slice();}
function setSpeedFromLabel(lbl){lbl=(lbl||'').toLowerCase(); var m=lbl.match(/([0-9.]+)x/);
  if(m) speedRatio=parseFloat(m[1]); else if(/slow/.test(lbl)) speedRatio=.9; else if(/sped|nightcore/.test(lbl)) speedRatio=1.12; else speedRatio=1;}
function geom(){var dpr=Math.min(devicePixelRatio||1,2), w=cvW.clientWidth, h=cvW.clientHeight;
  if(cvW.width!==w*dpr||cvW.height!==h*dpr){cvW.width=w*dpr;cvW.height=h*dpr;}
  var g=cvW.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); return {g:g,w:w,h:h};}
function barColor(lo,hi,cen){var warmth=(lo-hi)-(cen-.5)*.6; var t=Math.max(0,Math.min(1,.62+warmth*.3)); return mix(pal.cool,pal.signal,t);}
function curveOpen(g,pts){g.moveTo(pts[0].x,pts[0].y);
  for(var i=0;i<pts.length-1;i++){var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    g.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y);}}
function curveLoop(g,L){var n=L.length; g.moveTo(L[0].x,L[0].y);
  for(var i=0;i<n;i++){var p0=L[(i-1+n)%n],p1=L[i],p2=L[(i+1)%n],p3=L[(i+2)%n];
    g.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y);}}
function ribbon(g,w,h,A,LO,HI,cen,bass,alpha){
  var mid=h/2, Hs=h*0.34, N=A.length; if(N<2) return; var top=[],bot=[];
  for(var i=0;i<N;i++){var x=i/(N-1)*w, a=Math.max(0,(A[i]||0)); if(!isFinite(a))a=0; a=Math.max(0.02,a)*Hs;
    top.push({x:x,y:mid-a}); bot.push({x:x,y:mid+a});}
  var hg=g.createLinearGradient(0,0,w,0);
  for(var j=0;j<N;j++){var lo=LO.length?LO[j]:.36, hi=HI.length?HI[j]:.28; hg.addColorStop(j/(N-1),barColor(lo,hi,cen));}
  g.lineJoin='round'; g.lineCap='round';
  g.beginPath(); curveLoop(g,top.concat(bot.slice().reverse())); g.closePath();
  g.globalAlpha=alpha*0.22; g.fillStyle=hg; g.fill();
  g.lineWidth=1.5; g.strokeStyle=hg; g.globalAlpha=alpha;
  if(bass>0.3){g.shadowColor=pal.signal; g.shadowBlur=(bass-0.3)*11;}
  g.beginPath(); curveOpen(g,top); g.stroke();
  g.beginPath(); curveOpen(g,bot); g.stroke();

}
function draw(ts){var G=geom(),g=G.g,w=G.w,h=G.h,t=(ts||0)/1000; g.clearRect(0,0,w,h);
  var haveData=W.amp.length>0, A=new Array(NB);
  for(var i=0;i<NB;i++){var target;
    if(waveState==='idle'){var ph=i*0.16-t*0.85;
      target=0.20+0.40*(Math.sin(ph)*.5+.5)*(0.45+0.55*Math.sin(i*0.05+t*0.31))*(0.6+0.4*Math.sin(i*0.21-t*0.5));}
    else if(waveState==='scanning') target=haveData?W.amp[i]:0.13+0.08*(Math.sin(i*0.42+t*1.5)*.5+.5);
    else target=haveData?W.amp[i]:(bars[i]||0);
    if(!isFinite(bars[i]))bars[i]=0; if(!isFinite(target))target=0;
    bars[i]+=(target-bars[i])*0.3; A[i]=bars[i];}
  ribbon(g,w,h,A,W.lo,W.hi,W.centroid,waveState==='idle'?0:bassAmt,waveState==='idle'?0.7:0.95);
  if(waveState!=='locked') raf=requestAnimationFrame(draw);}

  if(raf)cancelAnimationFrame(raf); raf=null;}

function prow(label,song,artist,kind){var q=encodeURIComponent((artist?artist+' ':'')+song);
  var url=kind==='spotify'?'https://open.spotify.com/search/'+q:
          kind==='apple'?'https://music.apple.com/search?term='+q:
          kind==='soundcloud'?'https://soundcloud.com/search?q='+q:
          'https://www.youtube.com/results?search_query='+q;
  return '<a class="prow" href="'+url+'" target="_blank" rel="noopener"><span class="pi">'+IC[kind]+'</span>'+
    '<span class="pn">'+esc(label)+'</span><span class="pp">'+IC.plus+'</span></a>';}
function renderResult(d,partial){
  lastResult=d;
  if(d.result==='rate_limited'){result.innerHTML=noteCard('TikTok is busy','Too many pulls from this network. Wait a moment and try again.'); return;}
  if(d.result==='engine_down'){result.innerHTML=noteCard('Engine offline','Start Addify on your Mac, then paste again.'); return;}
  if(d.result==='error'){result.innerHTML=noteCard('Something broke',d.error||'Try again.'); return;}
  if(d.result==='uncertain'||d.base_uncertain){result.innerHTML=noteCard("Couldn't name this one", d.note||'The clip may be muted, private, or too transformed to match.'); return;}
  if(d.result==='no_match'){result.innerHTML=noteCard('No song here','Listened through the whole clip. This one is most likely genuine original audio, not a track.'); return;}
  if(!d.base_song){result.innerHTML=''; return;}
  var ex=d.exact||null, cands=d.candidates||[];
  var art=d.art? '<img class="art" src="'+esc(d.art)+'" alt="Cover art">' : '<div class="art ph">'+IC.bignote+'</div>';
  var clip = d.handle ? '<div class="clip">'+(d.thumb?'<img src="'+esc(d.thumb)+'" alt="" onerror="this.remove()">':'')+'<span class="h">@'+esc(d.handle)+'</span></div>' : '';
  document.getElementById('matchttl').textContent = partial?'Still digging…':'Match found';
  var head='';
  var hero='<div class="hero">'+art+'<h2 class="rtitle">'+esc(d.base_song)+'</h2>'+
    '<p class="rartist">'+esc(d.base_artist||'')+'</p>'+editBadge(d)+'</div>';
  var shelf='';
  if(ex){shelf='<div class="sect">The exact version playing</div><div class="list">'+trackRow(ex,true)+'</div>';
    var others=cands.filter(function(c){return c.url!==ex.url;});
    if(others.length) shelf+='<div class="sect">Other versions</div><div class="list">'+others.slice(0,5).map(function(c){return trackRow(c,false);}).join('')+'</div>';}
  else if(partial){shelf='<div class="sect">Digging for the exact version…</div>';}
  else{shelf='<div class="sect">No separate edit found. This looks like the track played straight.</div>';}
  var plat='<div class="sect">Add to playlist</div><div class="plat">'+
    prow('Spotify',d.base_song,d.base_artist,'spotify')+
    prow('Apple Music',d.base_song,d.base_artist,'apple')+
    prow('SoundCloud',d.base_song,d.base_artist,'soundcloud')+
    prow('YouTube',d.base_song,d.base_artist,'youtube')+
    (d.shazam?'<a class="prow" href="'+esc(d.shazam)+'" target="_blank" rel="noopener"><span class="pi">'+IC.shazam+'</span><span class="pn">Shazam</span><span class="pp">'+IC.open+'</span></a>':'')+
    '<button class="prow save" id="save"><span class="pi">'+IC.save+'</span><span class="pn">Save to library</span></button></div>';

  result.innerHTML='<div class="card">'+head+clip+hero+'<canvas class="reccanvas" id="reccanvas"></canvas>'+shelf+plat+quotes+'</div>';

}

function showErr(m){var e=document.getElementById('err'); e.hidden=false; e.textContent=m;
  clearTimeout(showErr._t); showErr._t=setTimeout(function(){e.hidden=true;},4500);}
function fromClipboard(){
  if(!(navigator.clipboard&&navigator.clipboard.readText)){
    showErr('Clipboard is blocked here. Paste the link into the box.'); urlEl.focus(); return;}
  navigator.clipboard.readText().then(function(t){
    if(parseLink(t).host){urlEl.value=t; run(t);}
    else {showErr('No TikTok or Instagram link on your clipboard.'); urlEl.focus();}
  }).catch(function(){showErr('Clipboard access was blocked. Paste the link into the box.'); urlEl.focus();});}
document.getElementById('go').onclick=function(){
  if(urlEl.value.trim()) run(urlEl.value); else fromClipboard();};
document.getElementById('paste').onclick=fromClipboard;
document.getElementById('example').onclick=function(){var ex='https://www.tiktok.com/@vision_hockey/video/7640595887873477909'; urlEl.value=ex; run(ex);};
function run(raw){if(busy) return; var p=parseLink(raw);
  result.innerHTML=''; W.amp=[]; setSpeedFromLabel(''); startClock();
  if(!p.host){setState('idle'); showErr('That does not look like a TikTok or Instagram link.'); stopClock(); return;}
  busy=true; document.getElementById('gobtn').setAttribute('disabled','');
  setState('scanning'); showChip(p.host,p.url.replace(/^https?:\/\/(www\.)?/,'').slice(0,44));
  headline('Listening…'); saying('Reading the clip');
  call('/base',p.url).then(function(d){
    if(d&&d.wave) setWaveData(d.wave); else if(d&&d.peaks) setWaveData({amp:d.peaks,lo:[],hi:[]});
    if(d&&d.result==='found'&&d.base_song){
      setSpeedFromLabel(d.speed);
      if(d.handle) showChip(p.host,'@'+d.handle+(d.secs?' · '+d.secs+'s':''));
      headline(d.base_song); saying('Checking against edits and remixes');
      renderResult(d, d.edits_pending);
      if(d.edits_pending){setState('scanning'); saying('Checking against edits and remixes');
        return call('/edits',p.url).then(function(full){if(full&&full.result&&full.result!=='engine_down'){if(full.wave)setWaveData(full.wave); setSpeedFromLabel(full.speed); renderResult(full,false);} finish(full||d);});
      } else finish(d);
    } else {renderResult(d,false); finish(d);}
  });
}
function finish(d){stopClock(); busy=false;
  document.getElementById('gobtn').removeAttribute('disabled');
  hideChip();
  if(d&&d.base_song){setState('locked'); paintRecCanvas();}
  else {setState('locked'); document.getElementById('matchttl').textContent='No match';}}

/* ---------- nav ---------- */
function goHome(){setState('idle'); result.innerHTML=''; hideChip(); urlEl.value='';}
document.getElementById('back').onclick=goHome;
document.getElementById('cancel').onclick=goHome;
document.getElementById('share').onclick=function(){
  var d=lastResult; if(!d) return; var u=(d.exact&&d.exact.url)||d.shazam||''; if(!u) return;
  var sh=document.getElementById('share');
  if(navigator.clipboard) navigator.clipboard.writeText(u).then(function(){
    sh.innerHTML=IC.savefill; setTimeout(function(){sh.innerHTML=IC.share;},1400);});};

/* ---------- boot ---------- */
renderCrate(); setState('idle');
</script>
