# PROPOSAL ONLY (CAPACITY 2026-10-08). Not installed anywhere. Changes live behaviour once
# installed, so it needs Roham's OK first.
#
# Install on the droplet as a systemd drop-in (it overrides only these two lines of
# /etc/systemd/system/addify-engine.service, nothing else):
#   install -D -m 644 addify-engine.memory.conf \
#       /etc/systemd/system/addify-engine.service.d/memory.conf
#   systemctl daemon-reload
#   systemctl show addify-engine -p MemoryHigh -p MemoryMax     # expect 5368709120 / 6442450944
# No restart is needed for the cgroup limits; verify with the systemctl show line above.
#
# WHY: the unit says MemoryHigh=13G and MemoryMax=14G, but the droplet has 7.9 GB of RAM and
# 4 GB of swap (free -m, 2026-10-08). A cap above RAM + swap never fires, so a runaway engine
# would push the whole box (Caddy, the tunnel, the health timer, sshd) into swap and then the
# kernel's global OOM killer, instead of being stopped and restarted on its own.
# Observed engine cgroup peaks: 2.16 GB this run (since 2026-10-07 11:38), 4.0 GB on the 5-day
# run that ended 2026-10-06 04:23 (the FD-leak window), 3.6 GB + 1.1 GB swap on 2026-10-06.
# 5G / 6G leaves room above every observed peak and about 2 GB for the rest of the box.
#
# What happens at the cap: above MemoryHigh the kernel reclaims and slows the engine; at
# MemoryMax it kills it (OOMPolicy=stop), Restart=always brings it back in 3 s, and
# addify-health.sh alerts on a crash loop. Scans running at that moment are lost and the
# page shows its "You're offline" card with Try again.
[Service]
MemoryHigh=5G
MemoryMax=6G
